* { margin:0; padding:0; box-sizing:border-box; }
body {

.container { max-width: 1400px; margin: 0 auto; }

.upload-zone {

}
.upload-box {

  font-size: 14px;

  transition: all 0.3s;
}
.btn:hover { background: #764ba2; transform: translateY(-2px); }
.btn-secondary { background: #6c757d; }
.grid-3 {
  display: grid;

  margin-bottom: 24px;

.card {

  color: #666;
  margin-bottom: 12px;

  letter-spacing: 0.5px;
}
.kpi { font-size: 32px; font-weight: 700; color: #667eea; margin: 8px 0; }
.kpi.positive { color: #27ae60; }
.kpi.negative { color: #e74c3c; }
.subtitle { font-size: 12px; color: #999; margin-top: 6px; }

th {

  padding: 10px;

  font-weight: 600;
  color: #333;
  border-bottom: 2px solid #e9ecef;
}
td { padding: 10px; border-bottom: 1px solid #e9ecef; }
tr:hover { background: #f8f9fa; }
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.badge-ok { background: #d5f4e6; color: #145a32; }
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  border-bottom: 2px solid #e9ecef;
}
.tab-btn {
  padding: 12px 16px;
  background: none;
  border: none;
  cursor: pointer;
  font-weight: 600;
  color: #666;
  border-bottom: 3px solid transparent;
  transition: all 0.3s;
}
.tab-btn.active { color: #667eea; border-bottom-color: #667eea; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.chart-container { position: relative; height: 300px; margin-top: 20px; }
