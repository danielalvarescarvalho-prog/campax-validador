<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validador — Campax</title>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Arial, sans-serif; background: #667eea; min-height: 100vh; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
header { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
h1 { color: #667eea; margin-bottom: 5px; }
.upload-zone { background: #fff; padding: 30px; border-radius: 8px; margin-bottom: 20px; text-align: center; border: 2px dashed #667eea; }
.btn { padding: 10px 20px; background: #667eea; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
.btn:hover { background: #764ba2; }
#fileInput { display: none; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
.card { background: #fff; padding: 15px; border-radius: 8px; }
.kpi { font-size: 28px; font-weight: bold; color: #667eea; }
table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 10px; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #f5f5f5; font-weight: bold; }
#results { display: none; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>📊 Validador Financeiro — Campax</h1>
<p>Processe seus arquivos Excel aqui</p>
</header>

<div class="upload-zone">
<p><strong>Arraste seu arquivo Excel aqui</strong></p>
<p style="font-size:12px;color:#999">ou clique para selecionar</p>
<button class="btn" onclick="document.getElementById('fileInput').click()">Selecionar</button>
<input type="file" id="fileInput" accept=".xlsx,.xls">
</div>

<div id="results" style="display:none">
<div class="grid">
<div class="card">
<h3>Receita</h3>
<div class="kpi" id="rec">R$ 0</div>
</div>
<div class="card">
<h3>Despesa</h3>
<div class="kpi" id="desp">R$ 0</div>
</div>
<div class="card">
<h3>Resultado</h3>
<div class="kpi" id="res">R$ 0</div>
</div>
</div>

<div class="card">
<h3>Receitas</h3>
<table id="tabRec"><thead><tr><th>Data</th><th>Descr</th><th>Valor</th></tr></thead><tbody></tbody></table>
</div>

<div class="card">
<h3>Despesas</h3>
<table id="tabDesp"><thead><tr><th>Data</th><th>Código</th><th>Descr</th><th>Valor</th></tr></thead><tbody></tbody></table>
</div>

<button class="btn" onclick="limpar()">Novo</button>
</div>
</div>

<script>
let dados = { rec: [], desp: [] };

document.getElementById('fileInput').addEventListener('change', e => processar(e.target.files[0]));
document.getElementById('fileInput').parentElement.addEventListener('drop', e => { e.preventDefault(); processar(e.dataTransfer.files[0]); });
document.getElementById('fileInput').parentElement.addEventListener('dragover', e => e.preventDefault());

function processar(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
    analisar(json);
  };
  reader.readAsArrayBuffer(file);
}

function analisar(json) {
  dados = { rec: [], desp: [] };
  json.forEach((row, idx) => {
    if (idx < 5 || !row[0]) return;
    const cod = String(row[1] || '').trim();
    const desc = String(row[2] || '').trim();
    const ent = parseFloat(row[3]) || 0;
    const sai = parseFloat(row[4]) || 0;
    if (cod === 'REC' && ent > 0) {
      dados.rec.push({ data: row[0], desc, val: ent });
    } else if (cod !== 'REC' && sai > 0) {
      dados.desp.push({ data: row[0], cod, desc, val: sai });
    }
  });
  renderizar();
}

function renderizar() {
  const rec = dados.rec.reduce((s, r) => s + r.val, 0);
  const desp = dados.desp.reduce((s, d) => s + d.val, 0);
  const res = rec - desp;
  
  document.getElementById('rec').textContent = 'R$ ' + rec.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  document.getElementById('desp').textContent = 'R$ ' + desp.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  document.getElementById('res').textContent = 'R$ ' + res.toLocaleString('pt-BR', { maximumFractionDigits: 2 });

  const tbR = document.querySelector('#tabRec tbody');
  tbR.innerHTML = '';
  dados.rec.forEach(r => {
    tbR.innerHTML += `<tr><td>${r.data}</td><td>${r.desc}</td><td>R$ ${r.val.toFixed(2)}</td></tr>`;
  });

  const tbD = document.querySelector('#tabDesp tbody');
  tbD.innerHTML = '';
  dados.desp.forEach(d => {
    tbD.innerHTML += `<tr><td>${d.data}</td><td>${d.cod}</td><td>${d.desc}</td><td>R$ ${d.val.toFixed(2)}</td></tr>`;
  });

  document.getElementById('results').style.display = 'block';
}

function limpar() {
  document.getElementById('results').style.display = 'none';
  document.getElementById('fileInput').value = '';
}
</script>
</body>
</html>
